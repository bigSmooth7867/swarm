      # NOTE: RAG embeddings currently run LOCALLY (sentence-transformers
      # all-MiniLM-L6-v2, ~900M cached in open-webui-cache volume below).
      #
      # TODO when GPU box is built:
      #   1. Serve an embedding model (e.g. nomic-embed-text) behind LiteLLM
      #   2. Switch embedding engine to OpenAI-compatible:
      #        RAG_EMBEDDING_ENGINE=openai
      #        RAG_OPENAI_API_BASE_URL=https://litellm.${DOMAIN}/v1
      #        RAG_OPENAI_API_KEY=...
      #        RAG_EMBEDDING_MODEL=<model name in LiteLLM>
      #   3. RE-INDEX all knowledge bases — old MiniLM vectors are
      #      incompatible with a new model (RAG silently degrades otherwise).
      #      Source files are safe in Garage; vectors are rebuildable.
      #   4. Remove the open-webui-cache volume + its mount -> zero-volume
      #   Same trip: point AUDIO_STT_* at Whisper on the GPU box.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Load Docker secrets that lack native _FILE support
        for secret in OAUTH_CLIENT_SECRET DATABASE_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
          secret_file="/run/secrets/$${secret}"
          if [ -f "$$secret_file" ]; then
            export "$$secret"="$$(cat $$secret_file)"
          fi
        done
        exec bash start.sh
    volumes:
      # Scratch only (audio temp, upload staging) — DB is Postgres, vectors
      # pgvector, files S3, so nothing here needs to survive a restart
      - type: tmpfs
        target: /app/backend/data
        tmpfs:
          size: 1073741824  # 1G
      # Model/HF cache (sentence-transformers, whisper, xet, etc.) on node-local
      # disk instead of RAM — disposable, but avoid re-downloading every restart
      - open-webui-cache:/app/backend/data/cache
    secrets:
      - OAUTH_CLIENT_SECRET
      - WEBUI_SECRET_KEY
      - DATABASE_URL
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    environment:
      # ===================
      # General / Privacy
      # ===================
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      - ENABLE_PERSISTENT_CONFIG=False
      - GLOBAL_LOG_LEVEL=WARNING
      # ===================
      # Docker Secrets (native _FILE support)
      # ===================
      - WEBUI_SECRET_KEY_FILE=/run/secrets/WEBUI_SECRET_KEY
      # ===================
      # External PostgreSQL Database
      # ===================
      - VECTOR_DB=pgvector
      # ===================
      # S3 Storage (Garage)
      # ===================
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT_URL=https://s3.${DOMAIN}
      - S3_BUCKET_NAME=open-webui
      - S3_REGION_NAME=us-east-1
      - S3_ADDRESSING_STYLE=path
      # S3_ACCESS_KEY_ID: injected via Docker secret (see entrypoint loop)
      # S3_SECRET_ACCESS_KEY: injected via Docker secret (see entrypoint loop)
      # - S3_KEY_PREFIX=uploads
      # ===================
      # LLM Backend (LiteLLM)
      # ===================
      # - OPENAI_API_BASE_URL=https://litellm.${DOMAIN}/v1
      # - OPENAI_API_KEY=
      # ===================
      # OAuth / Authentik
      # ===================
      - WEBUI_URL=https://open-webui.${DOMAIN}
      - OAUTH_PROVIDER_NAME=Authentik
      - OAUTH_CLIENT_ID=GdKTPUTzajv0F5wxo03xeUZic2QBr7fyVKNS2gxG
      - OPENID_PROVIDER_URL=https://auth.${DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      - ENABLE_LOGIN_FORM=False
      - ENABLE_OAUTH_SIGNUP=True
      - ENABLE_OAUTH_ROLE_MANAGEMENT=True
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_ADMIN_ROLES=openwebui-admins
      - OAUTH_ALLOWED_ROLES=openwebui-admins,openwebui-users
      - OAUTH_SCOPES=openid email profile groups
      # ===================
      # Web Search (SearXNG)
      # ===================
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      # ===================
      # RAG / Documents
      # ===================
      - RAG_FILE_MAX_SIZE=50
      - RAG_FILE_MAX_COUNT=10
      # ===================
      # Optional Features
      # ===================
      - ENABLE_IMAGE_GENERATION=False
      - ENABLE_COMMUNITY_SHARING=False
      - CORS_ALLOW_ORIGIN=https://open-webui.${DOMAIN}
      - ENABLE_OLLAMA_API=False
    #API Key Endpoint Restrictions
      - ENABLE_API_KEYS=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.open-webui.entrypoints=http"
        - "traefik.http.routers.open-webui.rule=Host(`open-webui.${DOMAIN}`)"
        - "traefik.http.middlewares.open-webui-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.open-webui.middlewares=open-webui-https-redirect"
        - "traefik.http.routers.open-webui-secure.entrypoints=https"
        - "traefik.http.routers.open-webui-secure.rule=Host(`open-webui.${DOMAIN}`)"
        - "traefik.http.routers.open-webui-secure.tls=true"
        - "traefik.http.routers.open-webui-secure.service=open-webui"
        - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
        - "traefik.swarm.network=proxy"
        # HOMEPAGE
        - "homepage.group=Personal"
        - "homepage.name=open-webui"
        - "homepage.icon=open-webui.png"
        - "homepage.href=https://open-webui.${DOMAIN}"

secrets:
  OAUTH_CLIENT_SECRET:
    external: true
    name: open-webui--oauth_client_secret
  WEBUI_SECRET_KEY:
    external: true
    name: open-webui--webui_secret_key
  DATABASE_URL:
    external: true
    name: open-webui--database_url
  S3_ACCESS_KEY_ID:
    external: true
    name: open-webui--s3_access_key_id
  S3_SECRET_ACCESS_KEY:
    external: true
    name: open-webui--s3_secret_access_key

networks:
  proxy:
    external: true

volumes:
  open-webui-cache:
    driver: local