services:
  pgadmin:
    image: dpage/pgadmin4:9.17
    extra_hosts:
      - "db.${DOMAIN}:${PG_IP}"
    secrets:
      - pgadmin--pgadmin_default_password
    volumes:
      - /mnt/cephfs/app_data/pgadmin/data:/var/lib/pgadmin
      - /mnt/cephfs/app_data/pgadmin/config_local.py:/pgadmin4/config_local.py:ro
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@${DOMAIN}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin--pgadmin_default_password
      GUNICORN_ACCESS_LOGFILE: /dev/null
      PGADMIN_DISABLE_POSTFIX: "true"
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgadmin.entrypoints=http"
        - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN}`)"
        - "traefik.http.middlewares.pgadmin-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.pgadmin.middlewares=pgadmin-https-redirect"
        - "traefik.http.routers.pgadmin-secure.entrypoints=https"
        - "traefik.http.routers.pgadmin-secure.rule=Host(`pgadmin.${DOMAIN}`)"
        - "traefik.http.routers.pgadmin-secure.tls=true"
        - "traefik.http.routers.pgadmin-secure.service=pgadmin"
        - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
        - "traefik.swarm.network=proxy"
        - homepage.group=Administration
        - homepage.name=pgadmin
        - homepage.icon=pgadmin.png
        - homepage.href=https://pgadmin.${DOMAIN}
    logging:
      options:
        max-size: "10m"

secrets:
  pgadmin--pgadmin_default_password:
    external: true

networks:
  proxy:
    external: true