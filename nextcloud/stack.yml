services:
  nextcloud:
    image: linuxserver/nextcloud:34.0.2-ls444
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/cephfs/app_data/nextcloud/config:/config
      - nextcloud-data:/data
    networks:
      - proxy
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.nextcloud.entrypoints=http"
        - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
        - "traefik.http.middlewares.nextcloud-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.nextcloud.middlewares=nextcloud-https-redirect"
        - "traefik.http.routers.nextcloud-secure.entrypoints=https"
        - "traefik.http.routers.nextcloud-secure.rule=Host(`nextcloud.${DOMAIN}`)"
        - "traefik.http.routers.nextcloud-secure.tls=true"
        - "traefik.http.routers.nextcloud-secure.service=nextcloud"
        - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
        - "traefik.swarm.network=proxy"
        - "traefik.http.middlewares.secureHeaders.headers.stsSeconds=15552000"
        - "traefik.http.middlewares.secureHeaders.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.secureHeaders.headers.stsPreload=true"
        - "traefik.http.middlewares.secureHeaders.headers.frameDeny=true"
        - "traefik.http.middlewares.secureHeaders.headers.customFrameOptionsValue=SAMEORIGIN"
        - "traefik.http.middlewares.secureHeaders.headers.sslRedirect=true"
        - "traefik.http.middlewares.secureHeaders.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.secureHeaders.headers.browserXssFilter=true"
        - "traefik.http.routers.nextcloud-secure.middlewares=secureHeaders"
        # HOMEPAGE
        - "homepage.group=Personal"
        - "homepage.name=nextcloud"
        - "homepage.icon=nextcloud.png"
        - "homepage.href=https://nextcloud.${DOMAIN}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nextcloud-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # NOTE: swarm NFS volume definitions are immutable. If you change the
  # options below, run `docker volume rm nextcloud_nextcloud-data` on every
  # node that created it, then redeploy.
  nextcloud-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/ssdp1/nextcloud"

networks:
  proxy:
    external: true
  internal:
    driver: overlay