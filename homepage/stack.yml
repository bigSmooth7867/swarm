services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.0.0
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN}
      PUID: 1000
      PGID: 1000
      LOG_LEVEL: warn
    networks:
      - proxy
      - dockerproxynet
    # ports:
    #   - target: 3000
    #     published: 9911
    #     protocol: tcp
    #     mode: host
    volumes:
      - /mnt/cephfs/app_data/homepage/config:/app/config
      # - /mnt/cephfs/app_data/homepage/icons:/app/public/icons
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.homepage.entrypoints=http"
        - "traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN}`)"
        - "traefik.http.middlewares.homepage-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.homepage.middlewares=homepage-https-redirect"
        - "traefik.http.routers.homepage-secure.entrypoints=https"
        - "traefik.http.routers.homepage-secure.rule=Host(`homepage.${DOMAIN}`)"
        - "traefik.http.routers.homepage-secure.tls=true"
        - "traefik.http.routers.homepage-secure.service=homepage"
        - "traefik.http.services.homepage.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        # DNSWEAVER
        - "dnsweaver.hostname=homepage.${DOMAIN}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  proxy:
    external: true
  dockerproxynet:
    external: true
