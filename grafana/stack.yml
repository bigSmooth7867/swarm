services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    # ports:
    #   - '9091:3000'
    secrets:
      - grafana--gf_auth_generic_oauth_client_id
      - grafana--gf_auth_generic_oauth_client_secret
      - grafana--pg_pass
      - grafana--gf_rendering_renderer_token
    environment:
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}/
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID__FILE=/run/secrets/grafana--gf_auth_generic_oauth_client_id
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE=/run/secrets/grafana--gf_auth_generic_oauth_client_secret
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${DOMAIN}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${DOMAIN}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${DOMAIN}/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.${DOMAIN}/application/o/grafana/end-session/
      # - GF_AUTH_OAUTH_AUTO_LOGIN=true
      # - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
      #possible fix
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'Grafana Admins') && 'GrafanaAdmin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      ######SECURITY######
      # - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # - GF_AUTH_ANONYMOUS_ENABLED=true
      ######Grafana Rendering######
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN__FILE=/run/secrets/grafana--gf_rendering_renderer_token
      - GF_LOG_LEVEL=warn
      ######Postgres Database######
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=db.${DOMAIN}:5000
      - GF_DATABASE_NAME=grafana_db
      - GF_DATABASE_USER=grafana_user
      - GF_DATABASE_PASSWORD__FILE=/run/secrets/grafana--pg_pass
      - GF_DATABASE_SSL_MODE=require
    volumes:
      - /mnt/cephfs/app_data/grafana:/var/lib/grafana
    networks:
      - internal
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.entrypoints=http"
        - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
        - "traefik.http.routers.grafana.middlewares=default-whitelist@file" #*** BUG??
        - "traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.grafana.middlewares=grafana-https-redirect" #*** BUG??
        - "traefik.http.routers.grafana-secure.entrypoints=https"
        - "traefik.http.routers.grafana-secure.rule=Host(`grafana.${DOMAIN}`)"
        - "traefik.http.routers.grafana-secure.tls=true"
        - "traefik.http.routers.grafana-secure.service=grafana"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        # HOMEPAGE
        - "homepage.group=Administration"
        - "homepage.name=grafana"
        - "homepage.icon=grafana.png"
        - "homepage.href=https://grafana.${DOMAIN}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  renderer:
    image: grafana/grafana-image-renderer:v5.12.2
    # ports:
    #   - 8081
    secrets:
      - grafana--gf_rendering_renderer_token
    environment:
      - LOG_LEVEL=warn
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        TOKEN=$$(cat /run/secrets/grafana--gf_rendering_renderer_token)
        exec tini -- /usr/bin/grafana-image-renderer server --server.auth-token="$$TOKEN"
    volumes:
      - /mnt/cephfs/app_data/grafana-image-render/config.json:/usr/src/app/config.json
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=warn'
    # ports:
    #   - "9090:9090"
    volumes:
      - /mnt/cephfs/app_data/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:3.7.7
    # entrypoint:
    #   - /bin/sh
    #   - -c
    #   - |
    #     export LOKI_S3_ACCESS_KEY_ID=$$(cat /run/secrets/loki--s3_access_key)
    #     export LOKI_S3_SECRET_ACCESS_KEY=$$(cat /run/secrets/loki--s3_secret_key)
    #     exec /usr/bin/loki "$$@"
    #   - --
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    stop_grace_period: 60s
    secrets:
      - loki--s3_access_key
      - loki--s3_secret_key
    volumes:
      # Config on cephfs (read-once at startup, no locking concerns)
      - /mnt/cephfs/app_data/loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      # Transient local state only: ingester WAL, tsdb index scratch, caches.
      # Chunks + index live in Garage S3 (bucket: loki-data).
      - loki-local:/loki
    networks:
      - internal
      - proxy
    deploy:
      # Single-binary mode: replicas MUST stay 1. Data is in S3 now, so the
      # node pin is no longer required — a reschedule only costs a cold cache.
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
 
  alloy:
    image: grafana/alloy:v1.18.1
    hostname: "{{.Node.Hostname}}"
    environment:
      - NODE_NAME={{.Node.Hostname}}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      # Shared config - identical on every node, so CephFS is ideal.
      - /mnt/cephfs/app_data/alloy/config/config.alloy:/etc/alloy/config.alloy:ro
      # Per-node state. Deliberately LOCAL: the WAL and file-position database
      # are hot small writes, and all three Alloy tasks pointing at one CephFS
      # directory would clobber each other's positions file.
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    user: root
    networks:
      - internal
    deploy:
      mode: global          # one per node, including nodes added later
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  alloy-data:
  loki-local:
    driver: local

networks:
  internal:
    driver: overlay
    internal: true
  proxy:
    external: true

secrets:
  grafana--gf_auth_generic_oauth_client_id:
    external: true
  grafana--gf_auth_generic_oauth_client_secret:
    external: true
  grafana--pg_pass:
    external: true
  grafana--gf_rendering_renderer_token:
    external: true
  loki--s3_access_key:
    external: true
  loki--s3_secret_key:
    external: true