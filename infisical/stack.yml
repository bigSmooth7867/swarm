services:
  backend:
    image: infisical/infisical:v0.165.10
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db.${DOMAIN}:5000/${POSTGRES_DB}?sslmode=require
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
      - SITE_URL=https://infisical.${DOMAIN}
      - TELEMETRY_ENABLED=false
      - SMTP_HOST=mail.smtp2go.com
      - SMTP_PORT=465
      - SMTP_USERNAME=infisical-1738
      - SMTP_PASSWORD=${SMTP_PASS}
      - SMTP_FROM_ADDRESS=infisical@${DOMAIN}
      - SMTP_FROM_NAME=Infisical
      - SMTP_HELO_HOST=infisical.${DOMAIN}
      - ALLOW_INTERNAL_IP_CONNECTIONS=true
    networks:
      - internal
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.infisical.entrypoints=http"
        - "traefik.http.routers.infisical.rule=Host(`infisical.${DOMAIN}`)"
        - "traefik.http.middlewares.infisical-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.infisical.middlewares=infisical-https-redirect"
        - "traefik.http.routers.infisical-secure.entrypoints=https"
        - "traefik.http.routers.infisical-secure.rule=Host(`infisical.${DOMAIN}`)"
        - "traefik.http.routers.infisical-secure.tls=true"
        - "traefik.http.routers.infisical-secure.service=infisical"
        - "traefik.http.services.infisical.loadbalancer.server.port=8080"
        # Network
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Administration"
        - "homepage.name=infisical"
        - "homepage.icon=infisical.png"
        - "homepage.href=https://infisical.${DOMAIN}"
        # DNSWEAVER
        - "dnsweaver.hostname=infisical.${DOMAIN}"

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 1Password Connect - reachable from Infisical at http://op-connect-api:8080
  # docker secret create op-infisical-credentials-file--1password-credentials  1password-credentials.json
  op-connect-api:
    image: 1password/connect-api:1.8
    environment:
      - OP_SESSION=/run/secrets/op-infisical-credentials-file--1password-credentials
    secrets:
      - op-infisical-credentials-file--1password-credentials
    volumes:
      - op-data:/home/opuser/.op/data
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  op-connect-sync:
    image: 1password/connect-sync:1.8
    environment:
      - OP_SESSION=/run/secrets/op-infisical-credentials-file--1password-credentials
    secrets:
      - op-infisical-credentials-file--1password-credentials
    volumes:
      - op-data:/home/opuser/.op/data
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  op-data:

secrets:
  op-infisical-credentials-file--1password-credentials:
    external: true

networks:
  proxy:
    external: true
  internal:
    driver: overlay