services:
  server:
    image: gitea/gitea:1.27.2
    secrets:
      - gitea--pg_db
      - gitea--pg_user
      - gitea--pg_pass
      - gitea--minio_access_key
      - gitea--minio_secret_key
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__server__SSH_Port=2221
      - GITEA__database__HOST=db.${DOMAIN}:5000
      - GITEA__database__SSL_MODE=require
      - GITEA__database__NAME__FILE=/run/secrets/gitea--pg_db
      - GITEA__database__USER__FILE=/run/secrets/gitea--pg_user
      - GITEA__database__PASSWD__FILE=/run/secrets/gitea--pg_pass
      - GITEA__log__LEVEL=Warn
      - GITEA__indexer__ISSUE_INDEXER_TYPE=db
      # S3 (Garage) global blob storage — single bucket for all types
      # [storage] is inherited by packages, attachments, lfs, avatars,
      # repo-avatars, repo-archive, actions_log, actions_artifacts.
      # Each type writes under its own prefix (packages/, lfs/, ...).
      # Bucket 'gitea' replaces 'gitea-packages'; package objects were
      # server-side copied (rclone, 2026-08-19) before cutover.
      - GITEA__storage__STORAGE_TYPE=minio
      - GITEA__storage__MINIO_ENDPOINT=s3.${DOMAIN}
      - GITEA__storage__MINIO_USE_SSL=true
      - GITEA__storage__MINIO_ACCESS_KEY_ID__FILE=/run/secrets/gitea--minio_access_key
      - GITEA__storage__MINIO_SECRET_ACCESS_KEY__FILE=/run/secrets/gitea--minio_secret_key
      - GITEA__storage__MINIO_BUCKET=gitea
      - GITEA__storage__MINIO_LOCATION=us-east-1
      - GITEA__storage__MINIO_BUCKET_LOOKUP=path
      # - SSH_LOG_LEVEL=ERROR
    volumes:
      - /mnt/cephfs/app_data/gitea/data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # ports:
    #   - target: 22
    #     published: 2221
    #     protocol: tcp
    #     mode: ingress
    ports:
      - target: 22
        published: 2221
        protocol: tcp
        mode: host
    networks:
      - internal
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.gitea.entrypoints=http"
        - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
        - "traefik.http.middlewares.gitea-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.gitea.middlewares=gitea-https-redirect"
        - "traefik.http.routers.gitea-secure.entrypoints=https"
        - "traefik.http.routers.gitea-secure.rule=Host(`gitea.${DOMAIN}`)"
        - "traefik.http.routers.gitea-secure.tls=true"
        - "traefik.http.routers.gitea-secure.service=gitea"
        - "traefik.http.services.gitea.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        # HOMEPAGE
        - "homepage.group=Administration"
        - "homepage.name=gitea"
        - "homepage.icon=gitea.png"
        - "homepage.href=https://gitea.${DOMAIN}/user/login"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # runner:
  #   image: gitea/runner:2.2.0
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /mnt/cephfs/app_data/gitea-runner/config.yaml:/config.yaml:ro
