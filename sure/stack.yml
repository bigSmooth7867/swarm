services:
  web:
    image: ghcr.io/we-promise/sure:0.7.3
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        export POSTGRES_PASSWORD=$$(cat /run/secrets/sure--pg_pass)
        export SECRET_KEY_BASE=$$(cat /run/secrets/sure--secret_key_base)
        export OIDC_CLIENT_SECRET=$$(cat /run/secrets/sure--oidc_client_secret)
        export TWELVE_DATA_API_KEY=$$(cat /run/secrets/sure--twelve_data_api_key)
        export BRAND_FETCH_CLIENT_ID=$$(cat /run/secrets/sure--brand_fetch_client_id)
        export ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$$(cat /run/secrets/sure--primary_key)
        export ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$$(cat /run/secrets/sure--deterministic_key)
        export ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$$(cat /run/secrets/sure--key_derivation_salt)
        export GENERIC_S3_ACCESS_KEY_ID=$$(cat /run/secrets/sure--s3_access_key_id)
        export GENERIC_S3_SECRET_ACCESS_KEY=$$(cat /run/secrets/sure--s3_secret_access_key)
        exec /rails/bin/docker-entrypoint "$$@"
      - "--"
    command: ./bin/rails server
    environment:
      # Core Rails
      # SECRET_KEY_BASE: injected via Docker secret
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "true"
      ONBOARDING_STATE: "closed"
      APP_DOMAIN: sure.${DOMAIN}
      PRODUCT_NAME: ${PRODUCT_NAME:-Sure}
      BRAND_NAME: ${BRAND_NAME:-Sure}
      # ActiveRecord Encryption
      # ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: injected via Docker secret
      # ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: injected via Docker secret
      # ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: injected via Docker secret
      # Database
      DB_HOST: db.${DOMAIN}
      DB_PORT: "5000"
      POSTGRES_USER: sure_user
      # POSTGRES_PASSWORD: injected via Docker secret
      POSTGRES_DB: sure_db
      PGSSLMODE: require
      # Redis (dedicated, stack-internal)
      REDIS_URL: redis://sure-redis:6379/0
      # Active Storage -> Garage (S3-compatible)
      ACTIVE_STORAGE_SERVICE: generic_s3
      GENERIC_S3_ENDPOINT: https://s3.${DOMAIN}
      GENERIC_S3_BUCKET: sure
      GENERIC_S3_REGION: us-east-1
      GENERIC_S3_FORCE_PATH_STYLE: "true"
      # GENERIC_S3_ACCESS_KEY_ID: injected via Docker secret
      # GENERIC_S3_SECRET_ACCESS_KEY: injected via Docker secret
      # OIDC / SSO
      OIDC_CLIENT_ID: UU9GwucbxEl1H5f2gvCxt6CJal7E3FutAMrkHv7b
      # OIDC_CLIENT_SECRET: injected via Docker secret
      OIDC_ISSUER: https://auth.${DOMAIN}/application/o/sure/
      OIDC_REDIRECT_URI: https://sure.${DOMAIN}/auth/openid_connect/callback
      OIDC_BUTTON_LABEL: "Sign in with Authentik"
      OIDC_BUTTON_ICON: "shield"
      AUTH_LOCAL_LOGIN_ENABLED: "false"
      AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "false"
      # AI / LLM
      # OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
      # OPENAI_MODEL: ${OPENAI_MODEL}
      # OPENAI_URI_BASE: ${OPENAI_URI_BASE}
      # Langfuse
      # LANGFUSE_HOST: ${LANGFUSE_HOST}
      # LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      # LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # Financial Data
      # TWELVE_DATA_API_KEY: injected via Docker secret
      EXCHANGE_RATE_PROVIDER: yahoo_finance
      SECURITIES_PROVIDER: yahoo_finance
      # BRAND_FETCH_CLIENT_ID: injected via Docker secret
      # SMTP
      # SMTP_ADDRESS: ${SMTP_ADDRESS}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USERNAME: ${SMTP_USERNAME}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # SMTP_TLS_ENABLED: ${SMTP_TLS_ENABLED}
      # EMAIL_SENDER: ${EMAIL_SENDER}
      # SimpleFin
      SIMPLEFIN_DEBUG_RAW: "false"
      SIMPLEFIN_INCLUDE_PENDING: "true"
      RAILS_LOG_LEVEL: warn
    networks:
      - sure-internal
      - proxy
    secrets:
      - sure--pg_pass
      - sure--secret_key_base
      - sure--oidc_client_secret
      - sure--twelve_data_api_key
      - sure--brand_fetch_client_id
      - sure--primary_key
      - sure--deterministic_key
      - sure--key_derivation_salt
      - sure--s3_access_key_id
      - sure--s3_secret_access_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sure.entrypoints=http"
        - "traefik.http.routers.sure.rule=Host(`sure.${DOMAIN}`)"
        - "traefik.http.middlewares.sure-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.sure.middlewares=sure-https-redirect"
        - "traefik.http.routers.sure-secure.entrypoints=https"
        - "traefik.http.routers.sure-secure.rule=Host(`sure.${DOMAIN}`)"
        - "traefik.http.routers.sure-secure.tls=true"
        - "traefik.http.routers.sure-secure.service=sure"
        - "traefik.http.services.sure.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        - "homepage.group=Personal"
        - "homepage.name=sure"
        - "homepage.icon=sure.svg"
        - "homepage.href=https://sure.${DOMAIN}"

  worker:
    image: ghcr.io/we-promise/sure:0.7.3
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        export POSTGRES_PASSWORD=$$(cat /run/secrets/sure--pg_pass)
        export SECRET_KEY_BASE=$$(cat /run/secrets/sure--secret_key_base)
        export OIDC_CLIENT_SECRET=$$(cat /run/secrets/sure--oidc_client_secret)
        export TWELVE_DATA_API_KEY=$$(cat /run/secrets/sure--twelve_data_api_key)
        export BRAND_FETCH_CLIENT_ID=$$(cat /run/secrets/sure--brand_fetch_client_id)
        export ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$$(cat /run/secrets/sure--primary_key)
        export ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$$(cat /run/secrets/sure--deterministic_key)
        export ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$$(cat /run/secrets/sure--key_derivation_salt)
        export GENERIC_S3_ACCESS_KEY_ID=$$(cat /run/secrets/sure--s3_access_key_id)
        export GENERIC_S3_SECRET_ACCESS_KEY=$$(cat /run/secrets/sure--s3_secret_access_key)
        exec /rails/bin/docker-entrypoint "$$@"
      - "--"
    command: bundle exec sidekiq
    environment:
      # Core Rails
      # SECRET_KEY_BASE: injected via Docker secret
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "true"
      ONBOARDING_STATE: "closed"
      APP_DOMAIN: sure.${DOMAIN}
      PRODUCT_NAME: ${PRODUCT_NAME:-Sure}
      BRAND_NAME: ${BRAND_NAME:-Sure}
      # ActiveRecord Encryption
      # ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: injected via Docker secret
      # ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: injected via Docker secret
      # ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: injected via Docker secret
      # Database
      DB_HOST: db.${DOMAIN}
      DB_PORT: "5000"
      POSTGRES_USER: sure_user
      # POSTGRES_PASSWORD: injected via Docker secret
      POSTGRES_DB: sure_db
      PGSSLMODE: require
      # Redis (dedicated, stack-internal)
      REDIS_URL: redis://sure-redis:6379/0
      # Active Storage -> Garage (S3-compatible)
      ACTIVE_STORAGE_SERVICE: generic_s3
      GENERIC_S3_ENDPOINT: https://s3.${DOMAIN}
      GENERIC_S3_BUCKET: sure
      GENERIC_S3_REGION: us-east-1
      GENERIC_S3_FORCE_PATH_STYLE: "true"
      # GENERIC_S3_ACCESS_KEY_ID: injected via Docker secret
      # GENERIC_S3_SECRET_ACCESS_KEY: injected via Docker secret
      # OIDC / SSO
      OIDC_CLIENT_ID: UU9GwucbxEl1H5f2gvCxt6CJal7E3FutAMrkHv7b
      # OIDC_CLIENT_SECRET: injected via Docker secret
      OIDC_ISSUER: https://auth.${DOMAIN}/application/o/sure/
      OIDC_REDIRECT_URI: https://sure.${DOMAIN}/auth/openid_connect/callback
      OIDC_BUTTON_LABEL: "Sign in with Authentik"
      OIDC_BUTTON_ICON: "shield"
      AUTH_LOCAL_LOGIN_ENABLED: "false"
      AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "false"
      # Financial Data
      # TWELVE_DATA_API_KEY: injected via Docker secret
      EXCHANGE_RATE_PROVIDER: yahoo_finance
      SECURITIES_PROVIDER: yahoo_finance
      # BRAND_FETCH_CLIENT_ID: injected via Docker secret
      # SimpleFin
      SIMPLEFIN_DEBUG_RAW: "false"
      SIMPLEFIN_INCLUDE_PENDING: "true"
      RAILS_LOG_LEVEL: warn
    networks:
      - sure-internal
    secrets:
      - sure--pg_pass
      - sure--secret_key_base
      - sure--oidc_client_secret
      - sure--twelve_data_api_key
      - sure--brand_fetch_client_id
      - sure--primary_key
      - sure--deterministic_key
      - sure--key_derivation_salt
      - sure--s3_access_key_id
      - sure--s3_secret_access_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  sure-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - sure-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  sure--pg_pass:
    external: true
  sure--secret_key_base:
    external: true
  sure--oidc_client_secret:
    external: true
  sure--twelve_data_api_key:
    external: true
  sure--brand_fetch_client_id:
    external: true
  sure--primary_key:
    external: true
  sure--deterministic_key:
    external: true
  sure--key_derivation_salt:
    external: true
  sure--s3_access_key_id:
    external: true
  sure--s3_secret_access_key:
    external: true

networks:
  sure-internal:
    driver: overlay
  proxy:
    external: true