services:
  label-printer:
    image: gitea.${DOMAIN}/${GITEA_ID}/brother-label-maker:1.0.4
    environment:
      - PRINTER_IP=labels.localdomain
      - LOG_LEVEL=warning
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.labels.entrypoints=http"
        - "traefik.http.routers.labels.rule=Host(`labels.${DOMAIN}`)"
        - "traefik.http.middlewares.labels-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.labels.middlewares=labels-https-redirect"
        - "traefik.http.routers.labels-secure.entrypoints=https"
        - "traefik.http.routers.labels-secure.rule=Host(`labels.${DOMAIN}`)"
        - "traefik.http.routers.labels-secure.tls=true"
        - "traefik.http.routers.labels-secure.service=labels"
        - "traefik.http.services.labels.loadbalancer.server.port=8000"
        - "traefik.swarm.network=proxy"
        # HOMEPAGE
        - "homepage.group=IoT"
        - "homepage.name=labels"
        - "homepage.href=https://labels.${DOMAIN}"
        # DNSWEAVER
        - "dnsweaver.hostname=labels.${DOMAIN}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  proxy:
    external: true