services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.8
    environment:
      # Database - pointing to Postgres cluster VIP
      - SEMAPHORE_DB_USER=semaphore_user
      - SEMAPHORE_DB_PASS_FILE=/run/secrets/semaphore--db_pass
      - SEMAPHORE_DB_HOST=db.${DOMAIN}
      - SEMAPHORE_DB_PORT=5000
      - SEMAPHORE_DB_DIALECT=postgres
      - SEMAPHORE_DB=semaphore_db
      - SEMAPHORE_DB_OPTIONS={"sslmode":"require"}

      # Security
      - SEMAPHORE_ACCESS_KEY_ENCRYPTION_FILE=/run/secrets/semaphore--access_key

      # # Initial admin user (only used on first run)
      # - SEMAPHORE_ADMIN=admin
      # - SEMAPHORE_ADMIN_NAME=Admin
      # - SEMAPHORE_ADMIN_EMAIL=admin@${DOMAIN}
      # - SEMAPHORE_ADMIN_PASSWORD_FILE=/run/secrets/semaphore--admin_password

      # General
      - SEMAPHORE_WEB_ROOT=https://semaphore.${DOMAIN}
      - SEMAPHORE_PLAYBOOK_PATH=/tmp/semaphore/
      - ANSIBLE_HOST_KEY_CHECKING=false
      - TZ=${TZ}

      # Authentik OIDC - uses file-based secrets for client_id and client_secret
      - >-
        SEMAPHORE_OIDC_PROVIDERS={
          "authentik": {
            "display_name": "Sign in with Authentik",
            "provider_url": "https://auth.${DOMAIN}/application/o/semaphore/",
            "client_id_file": "/run/secrets/semaphore--oidc_client_id",
            "client_secret_file": "/run/secrets/semaphore--oidc_client_secret",
            "redirect_url": "https://semaphore.${DOMAIN}/api/auth/oidc/authentik/redirect/",
            "scopes": ["openid", "profile", "email"],
            "username_claim": "preferred_username",
            "name_claim": "preferred_username"
          }
        }

    secrets:
      - semaphore--db_pass
      - semaphore--access_key
      # - semaphore--admin_password
      - semaphore--oidc_client_id
      - semaphore--oidc_client_secret
    volumes:
      - /mnt/cephfs/app_data/semaphore/config:/etc/semaphore
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.semaphore.entrypoints=http"
        - "traefik.http.routers.semaphore.rule=Host(`semaphore.${DOMAIN}`)"
        - "traefik.http.middlewares.semaphore-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.semaphore.middlewares=semaphore-https-redirect"
        - "traefik.http.routers.semaphore-secure.entrypoints=https"
        - "traefik.http.routers.semaphore-secure.rule=Host(`semaphore.${DOMAIN}`)"
        - "traefik.http.routers.semaphore-secure.tls=true"
        - "traefik.http.routers.semaphore-secure.service=semaphore"
        - "traefik.http.services.semaphore.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        # HOMEPAGE
        - "homepage.group=Administration"
        - "homepage.name=Semaphore"
        - "homepage.icon=semaphore.png"
        - "homepage.href=https://semaphore.${DOMAIN}"


secrets:
  semaphore--db_pass:
    external: true
  semaphore--access_key:
    external: true
  # semaphore--admin_password:
  #   external: true
  semaphore--oidc_client_id:
    external: true
  semaphore--oidc_client_secret:
    external: true

networks:
  proxy:
    external: true