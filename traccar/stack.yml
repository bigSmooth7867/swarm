services:
  traccar:
    image: traccar/traccar:6.15.3
    hostname: traccar
    ports:
      - target: 5013
        published: 5013
        protocol: tcp
        mode: host
      # - target: 8082
      #   published: 1082
      #   protocol: tcp
      #   mode: host
      # - target: 5055
      #   published: 5055
      #   protocol: tcp
      #   mode: host
    entrypoint: /bin/sh
    command:
      - -c
      - |
        export DATABASE_PASSWORD=$$(cat /run/secrets/traccar--pg_pass)
        export OPENID_CLIENT_SECRET=$$(cat /run/secrets/traccar--oidc_client_secret)
        exec /opt/traccar/jre/bin/java -Djava.net.preferIPv4Stack=true -Xms512m -Xmx512m \
          -jar tracker-server.jar conf/traccar.xml
    secrets:
      - traccar--pg_pass
      - traccar--oidc_client_secret
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://db.${DOMAIN}:5000/traccar_db?sslmode=require
      DATABASE_USER: traccar_user
      OPENID_FORCE: "false"
      OPENID_CLIENT_ID: ZHEgtYdjpXuY31HyxeT3NVxk7oZskXg9NhjWfrPo
      OPENID_AUTH_URL: https://auth.${DOMAIN}/application/o/authorize/
      OPENID_TOKEN_URL: https://auth.${DOMAIN}/application/o/token/
      OPENID_USER_INFO_URL: https://auth.${DOMAIN}/application/o/userinfo/
      OPENID_ALLOW_GROUP: user
      OPENID_ADMIN_GROUP: admin
      WEB_URL: https://traccar.${DOMAIN}
      LOGGER_LEVEL: warning
      LOGGER_CONSOLE: "true"
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy"
        - "traefik.http.routers.traccar.entrypoints=http"
        - "traefik.http.routers.traccar.rule=Host(`traccar.${DOMAIN}`)"
        - "traefik.http.middlewares.traccar-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.traccar.middlewares=traccar-https-redirect"
        - "traefik.http.routers.traccar-secure.entrypoints=https"
        - "traefik.http.routers.traccar-secure.rule=Host(`traccar.${DOMAIN}`)"
        - "traefik.http.routers.traccar-secure.tls=true"
        - "traefik.http.routers.traccar-secure.tls.certresolver=cloudflare"
        - "traefik.http.routers.traccar-secure.service=traccar"
        - "traefik.http.services.traccar.loadbalancer.server.port=8082"
        # HOMEPAGE
        - homepage.group=Personal
        - homepage.name=traccar
        - homepage.icon=traccar.png
        - homepage.href=https://traccar.${DOMAIN}
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/server || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

secrets:
  traccar--pg_pass:
    external: true
  traccar--oidc_client_secret:
    external: true

networks:
  proxy:
    external: true