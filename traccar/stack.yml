services:
  traccar:
    image: traccar/traccar:6.14.5
    hostname: traccar
    ports:
      - target: 5013
        published: 5013
        protocol: tcp
        mode: host
      # - target: 8082
      #   published: 1082
      #   protocol: tcp
      #   mode: host
      # - target: 5055
      #   published: 5055
      #   protocol: tcp
      #   mode: host
    volumes:
      - /mnt/cephfs/app_data/traccar/logs:/opt/traccar/logs:rw
      - /mnt/cephfs/app_data/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    networks:
      - proxy
    command: >
      -Djava.net.preferIPv4Stack=true
      -Xms512m
      -Xmx512m
      -jar tracker-server.jar conf/traccar.xml
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      labels:
        # TRAEFIK
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy"
        - "traefik.http.routers.traccar.entrypoints=http"
        - "traefik.http.routers.traccar.rule=Host(`traccar.${DOMAIN}`)"
        - "traefik.http.middlewares.traccar-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.traccar.middlewares=traccar-https-redirect"
        - "traefik.http.routers.traccar-secure.entrypoints=https"
        - "traefik.http.routers.traccar-secure.rule=Host(`traccar.${DOMAIN}`)"
        - "traefik.http.routers.traccar-secure.tls=true"
        - "traefik.http.routers.traccar-secure.tls.certresolver=cloudflare"
        - "traefik.http.routers.traccar-secure.service=traccar"
        - "traefik.http.services.traccar.loadbalancer.server.port=8082"
        # HOMEPAGE
        - homepage.group=Personal
        - homepage.name=traccar
        - homepage.icon=traccar.png
        - homepage.href=https://traccar.${DOMAIN}
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/server || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  proxy:
    external: true