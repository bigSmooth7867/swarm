services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    hostname: "dockerproxy-{{.Node.Hostname}}"
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - POST=0
      - INFO=1          # needed for startup docker info call
      - EVENTS=1        # needed to watch container/service events
      - LOG_LEVEL=warning
    networks:
      - dockerproxynet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dockerproxynet:
    external: true
