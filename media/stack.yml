volumes:

  media-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/data"
  media-usenet:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/data/usenet"

secrets:
  profilarr--api_key:
    external: true
  profilarr--oidc_client_secret:
    external: true

networks:
  proxy:
    external: true