services:
  prowlarr:
    image: linuxserver/prowlarr:2.5.2.5491-ls156
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/cephfs/app_data/prowlarr/data:/config
    # ports:
    #     - 9696:9696
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.prowlarr.entrypoints=http"
        - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
        - "traefik.http.middlewares.prowlarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.prowlarr.middlewares=prowlarr-https-redirect"
        - "traefik.http.routers.prowlarr-secure.entrypoints=https"
        - "traefik.http.routers.prowlarr-secure.rule=Host(`prowlarr.${DOMAIN}`)"
        - "traefik.http.routers.prowlarr-secure.tls=true"
        - "traefik.http.routers.prowlarr-secure.service=prowlarr"
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
        - "traefik.http.routers.prowlarr-secure.middlewares=middlewares-authentik@file" 
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Media"
        - "homepage.name=prowlarr"
        - "homepage.icon=prowlarr.png"
        - "homepage.href=https://prowlarr.${DOMAIN}"

  radarr:
    image: linuxserver/radarr:6.3.0.10514-ls313
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/cephfs/app_data/radarr/data:/config
      - media-data:/data
    # ports:
    #   - 7878:7878
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.radarr.entrypoints=http"
        - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
        - "traefik.http.middlewares.radarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.radarr.middlewares=radarr-https-redirect"
        - "traefik.http.routers.radarr-secure.entrypoints=https"
        - "traefik.http.routers.radarr-secure.rule=Host(`radarr.${DOMAIN}`)"
        - "traefik.http.routers.radarr-secure.tls=true"
        - "traefik.http.routers.radarr-secure.service=radarr"
        - "traefik.http.services.radarr.loadbalancer.server.port=7878"
        - "traefik.http.routers.radarr-secure.middlewares=middlewares-authentik@file"
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - homepage.group=Media
        - homepage.name=radarr
        - homepage.icon=radarr.png
        - homepage.href=https://radarr.${DOMAIN}

  sonarr:
    image: linuxserver/sonarr:4.0.19.2979-ls322
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - /mnt/cephfs/app_data/sonarr/data:/config
      - media-data:/data
    # ports:
    #   - 8989:8989 
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.sonarr.entrypoints=http"
        - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
        - "traefik.http.middlewares.sonarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.sonarr.middlewares=sonarr-https-redirect"
        - "traefik.http.routers.sonarr-secure.entrypoints=https"
        - "traefik.http.routers.sonarr-secure.rule=Host(`sonarr.${DOMAIN}`)"
        - "traefik.http.routers.sonarr-secure.tls=true"
        - "traefik.http.routers.sonarr-secure.service=sonarr"
        - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
        - "traefik.http.routers.sonarr-secure.middlewares=middlewares-authentik@file"
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Media"
        - "homepage.name=sonarr"
        - "homepage.icon=sonarr.png"
        - "homepage.href=https://sonarr.${DOMAIN}"

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0
    # ports:
    #   - 6868:6868
    volumes:
      - /home/nexus/local/profilarr/config:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - ORIGIN=https://profilarr.${DOMAIN}
      # - PORT=6868
      # - HOST=0.0.0.0
      # - PARSER_HOST=parser
      # - PARSER_PORT=5000
      - AUTH=oidc
      - OIDC_CLIENT_ID=AK11f12grQb6lZGZyvTeLBpAmKuWRXXvZ1KNkABT
      - OIDC_DISCOVERY_URL=https://auth.${DOMAIN}/application/o/profilarr/.well-known/openid-configuration
      - OIDC_CLIENT_SECRET_FILE=/run/secrets/profilarr--oidc_client_secret
      - PROFILARR_API_KEY_FILE=/run/secrets/profilarr--api_key
    secrets:
      - profilarr--oidc_client_secret
      - profilarr--api_key
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == swarm-02
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.profilarr.entrypoints=http"
        - "traefik.http.routers.profilarr.rule=Host(`profilarr.${DOMAIN}`)"
        - "traefik.http.middlewares.profilarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.profilarr.middlewares=profilarr-https-redirect"
        - "traefik.http.routers.profilarr-secure.entrypoints=https"
        - "traefik.http.routers.profilarr-secure.rule=Host(`profilarr.${DOMAIN}`)"
        - "traefik.http.routers.profilarr-secure.tls=true"
        - "traefik.http.routers.profilarr-secure.service=profilarr"
        - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Media"
        - "homepage.name=profilarr"
        - "homepage.icon=profilarr.png"
        - "homepage.href=https://profilarr.${DOMAIN}"

  sabnzbd:
    image: linuxserver/sabnzbd:5.1.1-ls267
