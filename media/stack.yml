services:
  prowlarr:
    image: linuxserver/prowlarr:2.6.5.5623-ls162
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      # All settings pinned via env (env overrides config.xml); state lives in Postgres.
      # Server
      - PROWLARR__SERVER__PORT=9696
      - PROWLARR__SERVER__ALLOWEDHOSTS=prowlarr.${DOMAIN},prowlarr,media_prowlarr
      # Postgres (DB names/users must match the existing databases)
      - PROWLARR__POSTGRES__HOST=db.${DOMAIN}
      - PROWLARR__POSTGRES__PORT=5000
      - PROWLARR__POSTGRES__USER=prowlarr_user
      - PROWLARR__POSTGRES__MAINDB=prowlarr-main
      - PROWLARR__POSTGRES__LOGDB=prowlarr-log
      - FILE__PROWLARR__POSTGRES__PASSWORD=/run/secrets/prowlarr--pg_pass
      # Auth: External = Authentik forward-auth in front, no app login.
      # API key pinned so integrations survive config wipes.
      - FILE__PROWLARR__AUTH__APIKEY=/run/secrets/prowlarr--api_key
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
      # Logging: Warn to the console only (Warn turns the log files off)
      - PROWLARR__LOG__LEVEL=Warn
      - PROWLARR__LOG__CONSOLELEVEL=Warn
      - PROWLARR__LOG__ROTATE=10
      - PROWLARR__LOG__ANALYTICSENABLED=False
      # App
      - PROWLARR__APP__INSTANCENAME=Prowlarr
    secrets:
      - prowlarr--pg_pass
      - prowlarr--api_key
    volumes:
      - /home/nexus/local/prowlarr/data:/config
    # ports:
    #     - 9696:9696
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.homeauto == true   
          - node.hostname == swarm-01   # data is local on swarm-01 now
      restart_policy:
        condition: any
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.prowlarr.entrypoints=http"
        - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
        - "traefik.http.middlewares.prowlarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.prowlarr.middlewares=prowlarr-https-redirect"
        - "traefik.http.routers.prowlarr-secure.entrypoints=https"
        - "traefik.http.routers.prowlarr-secure.rule=Host(`prowlarr.${DOMAIN}`)"
        - "traefik.http.routers.prowlarr-secure.tls=true"
        - "traefik.http.routers.prowlarr-secure.service=prowlarr"
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
        - "traefik.http.routers.prowlarr-secure.middlewares=middlewares-authentik@file" 
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Media"
        - "homepage.name=prowlarr"
        - "homepage.icon=prowlarr.png"
        - "homepage.href=https://prowlarr.${DOMAIN}"
        # DNSWEAVER
        - "dnsweaver.hostname=prowlarr.${DOMAIN}"

  radarr:
    image: linuxserver/radarr:6.4.4.10685-ls318
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      # All settings pinned via env (env overrides config.xml); state lives in Postgres.
      # Server
      - RADARR__SERVER__PORT=7878
      - RADARR__SERVER__ALLOWEDHOSTS=radarr.${DOMAIN},radarr,media_radarr
      # Postgres (DB names/users must match the existing databases)
      - RADARR__POSTGRES__HOST=db.${DOMAIN}
      - RADARR__POSTGRES__PORT=5000
      - RADARR__POSTGRES__USER=radarr_user
      - RADARR__POSTGRES__MAINDB=radarr-main
      - RADARR__POSTGRES__LOGDB=radarr-log
      - FILE__RADARR__POSTGRES__PASSWORD=/run/secrets/radarr--pg_pass
      # Auth: External = Authentik forward-auth in front, no app login.
      # API key pinned so integrations survive config wipes.
      - FILE__RADARR__AUTH__APIKEY=/run/secrets/radarr--api_key
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
      # Logging: Warn to the console only (Warn turns the log files off)
      - RADARR__LOG__LEVEL=Warn
      - RADARR__LOG__CONSOLELEVEL=Warn
      - RADARR__LOG__ROTATE=10
      - RADARR__LOG__ANALYTICSENABLED=False
      # App
      - RADARR__APP__INSTANCENAME=Radarr
    secrets:
      - radarr--pg_pass
      - radarr--api_key
    volumes:
      # - /home/nexus/local/radarr/data:/config   # old location; rollback = swap back
      - radarr-config:/config
      - media-data:/data
      # Throwaway log folder: console (Warn) is what matters; nothing kept on NFS
      - type: tmpfs
        target: /config/logs
    # ports:
    #   - 7878:7878
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.homeauto == true   
          - node.hostname == swarm-01   # data is local on swarm-01 now
      restart_policy:
        condition: any
      labels:
      #TRAEFIK
        - "traefik.enable=true"
        - "traefik.http.routers.radarr.entrypoints=http"
        - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
        - "traefik.http.middlewares.radarr-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.radarr.middlewares=radarr-https-redirect"
        - "traefik.http.routers.radarr-secure.entrypoints=https"
        - "traefik.http.routers.radarr-secure.rule=Host(`radarr.${DOMAIN}`)"
        - "traefik.http.routers.radarr-secure.tls=true"
        - "traefik.http.routers.radarr-secure.service=radarr"
        - "traefik.http.services.radarr.loadbalancer.server.port=7878"
        - "traefik.http.routers.radarr-secure.middlewares=middlewares-authentik@file"
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - homepage.group=Media
        - homepage.name=radarr
        - homepage.icon=radarr.png
        - homepage.href=https://radarr.${DOMAIN}
        # DNSWEAVER
        - "dnsweaver.hostname=radarr.${DOMAIN}"

