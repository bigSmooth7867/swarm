        - "traefik.http.routers.sabnzbd-secure.middlewares=middlewares-authentik@file"
        - "traefik.swarm.network=proxy"
      #HOMEPAGE
        - "homepage.group=Media"
        - "homepage.name=sabnzbd"
        - "homepage.icon=sabnzbd.png"
        - "homepage.href=https://sabnzbd.${DOMAIN}"

  iSponsorBlockTV:
      image: ghcr.io/dmunozv04/isponsorblocktv:v2.10.0
      volumes:
        - /mnt/cephfs/app_data/isponsorblocktv:/app/data
      networks:
        - proxy
