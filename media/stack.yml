volumes:
  media-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/data"
  media-usenet:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/data/usenet"
  # Sonarr/Radarr /config on NFS (state is in Postgres; this is mostly MediaCover)
  sonarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/config/sonarr"
  radarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.localdomain,rw,nfsvers=4,hard,noatime
      device: ":/mnt/tank/media/config/radarr"

secrets:
  prowlarr--pg_pass:
    external: true
  prowlarr--api_key:
    external: true
  radarr--pg_pass:
    external: true
  radarr--api_key:
    external: true
  sonarr--pg_pass:
    external: true
  sonarr--api_key:
    external: true
  profilarr--api_key:
    external: true
  profilarr--oidc_client_secret:
    external: true


networks:
  proxy:
    external: true
